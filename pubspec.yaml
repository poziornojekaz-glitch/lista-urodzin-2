name: listaurodzin
description: Aplikacja do przypominania o urodzinach.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  awesome_notifications: ^0.10.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  share_plus: ^10.0.2
  intl: ^0.19.0
  google_fonts: ^6.2.1
  permission_handler: ^11.3.1
  file_picker: ^8.1.4
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/logo_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo_icon.png"
  adaptive_icon_foreground_inset: 20

flutter:
  uses-material-design: true
  assets:
    - assets/images/
