name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android --project-name=lista_urodzin --org=com.lista_urodzin .

      - name: Unpack project files
        run: python3 .github/scripts/unpack.py

      - name: Fix pubspec.yaml versions
        run: |
          sed -i 's/intl: \^0.20.3/intl: ^0.19.0/' pubspec.yaml
          sed -i 's/intl: "\^0.20.3"/intl: ^0.19.0/' pubspec.yaml

      - name: Ensure logo asset exists
        run: |
          mkdir -p assets/images
          if [ ! -f assets/images/logo.jpg ]; then
            echo "Tworzenie placeholdera logo.jpg..."
            python3 -c "
import base64, pathlib
b64 = '/9j/4AAQSkZJRgABAQEAYABgAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/wAALCAABAAEBAREA/8QAFAABAAAAAAAAAAAAAAAAAAAACf/EABQQAQAAAAAAAAAAAAAAAAAAAAD/2gAIAQEAAD8AKp//2Q=='
p = pathlib.Path('assets/images/logo.jpg')
p.write_bytes(base64.b64decode(b64))
print('Utworzono placeholder')
"
          else
            echo "logo.jpg juz istnieje - uzywam go"
          fi
          ls -la assets/images/

      - name: Patch Android for awesome_notifications
        run: python3 .github/scripts/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons || echo "Ikony pominięte - kontynuujemy"

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lista-urodzin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
