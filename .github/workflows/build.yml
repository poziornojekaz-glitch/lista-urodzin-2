name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android platform files
        run: flutter create --platforms=android --project-name=lista_urodzin --org=com.lista_urodzin .

      - name: Unpack project files
        run: python3 .github/scripts/unpack.py

      - name: Patch Android for awesome_notifications
        run: python3 .github/scripts/patch_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lista-urodzin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
